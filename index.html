      10, ['+', ['case', thin, 1.5, 2.5], extra],
      12, ['+', ['case', thin, 2, 3], extra],
      16, ['+', ['case', thin, 3.5, 6], extra],
      20, ['+', ['case', thin, 6, 11], extra]];
    const offset = ['interpolate', ['linear'], ['zoom'], 12, 0, 16, -3, 20, -8];
    // Flyover only: a soft glow under the line as it draws itself
    map.addLayer({ id: 'tour-glow', type: 'line', source: 'sel', layout: { ...round, visibility: 'none' },
      paint: { 'line-gradient': gradient(STOP), 'line-width': routeWidth(14), 'line-blur': 12, 'line-offset': offset, 'line-opacity': 0.55 } });
    map.addLayer({ id: 'sel-casing', type: 'line', source: 'sel', layout: round,
      paint: { 'line-color': '#ffffff', 'line-width': routeWidth(3), 'line-offset': offset,
        'line-opacity': ['interpolate', ['linear'], ['zoom'], 12, ['case', ['boolean', ['get', 'dim'], false], 0.4, 0.9], 16, ['case', ['boolean', ['get', 'dim'], false], 0.3, 0.6]] } });
    map.addLayer({ id: 'sel-line', type: 'line', source: 'sel', layout: round,
      paint: { 'line-color': ['get', 'color'], 'line-gradient': gradient(STOP), 'line-width': routeWidth(0), 'line-offset': offset,
        'line-opacity': ['interpolate', ['linear'], ['zoom'], 12, ['case', ['boolean', ['get', 'dim'], false], 0.25, 0.85], 16, ['case', ['boolean', ['get', 'dim'], false], 0.2, 0.55]] } });
    // Direction arrows beside the line, on the travel (left) side
    map.addLayer({ id: 'sel-arrows', type: 'symbol', source: 'sel', minzoom: 12,
      filter: ['!', ['boolean', ['get', 'dim'], false]],
      layout: {
        'symbol-placement': 'line', 'symbol-spacing': 110,
        'icon-image': 'route-arrow', 'icon-size': ['interpolate', ['linear'], ['zoom'], 12, 0.5, 16, 0.7, 20, 1],
        'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-rotation-alignment': 'map',
        'icon-offset': ['interpolate', ['linear'], ['zoom'], 12, ['literal', [0, -14]], 16, ['literal', [0, -18]], 20, ['literal', [0, -22]]],
      },
      paint: { 'icon-color': ['get', 'color'], 'icon-halo-color': '#ffffff', 'icon-halo-width': 1.5 } });

    // Passing routes: bus number written along each line
    map.addLayer({ id: 'sel-labels', type: 'symbol', source: 'sel',
      filter: ['all', ['has', 'no'], ['!', ['boolean', ['get', 'dim'], false]]],
      layout: {
        'symbol-placement': 'line', 'symbol-spacing': 260, 'text-field': ['get', 'no'],
        'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-padding': 4, 'text-keep-upright': true,
      },
      paint: { 'text-color': ['get', 'color'], 'text-halo-color': '#ffffff', 'text-halo-width': 2 } });

    // Stops sit on top of route lines
    for (const id of ['stops', 'stops-icon']) map.moveLayer(id);

    map.addSource('sel-stops', { type: 'geojson', data: fc([]) });
    map.addLayer({ id: 'sel-stops-dot', type: 'circle', source: 'sel-stops',
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, ['case', ['get', 'end'], 4, 1.8], 15, ['case', ['get', 'end'], 8, 4.5], 18, ['case', ['get', 'end'], 11, 8]],
        'circle-color': '#ffffff', 'circle-stroke-color': ['get', 'color'],
        'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 10, ['case', ['get', 'end'], 2.5, 1.2], 15, ['case', ['get', 'end'], 4, 2.4]],
      } });
    map.addLayer({ id: 'sel-stops-label', type: 'symbol', source: 'sel-stops',
      filter: ['any', ['get', 'end'], ['>=', ['zoom'], 15]],
      layout: {
        'text-field': ['step', ['zoom'], ['get', 'name'], 16,
          ['case', hasCode, ['format', ['get', 'name'], {}, '\n', {}, ['get', 'code'], { 'font-scale': 0.85, 'text-font': ['literal', ['Noto Sans Regular']], 'text-color': '#7a8190' }], ['get', 'name']]],
        'text-font': ['Noto Sans Bold'], 'text-size': ['case', ['get', 'end'], 13, 11.5], 'text-line-height': 1.15, 'text-letter-spacing': 0.01,
        // Beside the dot, left-aligned, flipping sides to dodge the line/other labels
        'text-variable-anchor': ['left', 'right'], 'text-radial-offset': 0.9, 'text-justify': 'auto',
        'text-max-width': 14, 'text-optional': true, 'text-padding': 3,
        'symbol-sort-key': ['case', ['get', 'end'], 0, 1],
      },
      paint: { 'text-color': '#2b2f38', 'text-halo-color': 'rgba(255,255,255,0.95)', 'text-halo-width': 2, 'text-halo-blur': 0.5 } });

    // Flyover only: a pulsing ring, flat on the ground, round the stop the bus is at (white) and, for good, round each stop
    // where you change to rail (the line's colour, with its code)
    map.addLayer({ id: 'tour-rail-ring', type: 'circle', source: 'sel-stops', filter: ['any', ['has', 'rail'], ['has', 'here']], layout: { visibility: 'none' },
      paint: { 'circle-radius': 24, 'circle-color': ['get', 'ring'], 'circle-opacity': 0.25, 'circle-stroke-color': ['get', 'ring'], 'circle-stroke-width': 4,
        'circle-pitch-alignment': 'map' } }, 'sel-stops-dot');
    map.addLayer({ id: 'tour-rail-label', type: 'symbol', source: 'sel-stops', filter: ['has', 'rail'],
      layout: { visibility: 'none', 'text-field': ['get', 'rail'], 'text-font': ['Noto Sans Bold'], 'text-size': 13,
        'text-anchor': 'bottom', 'text-offset': [0, -1.5], 'text-allow-overlap': true, 'text-ignore-placement': true },
      paint: { 'text-color': ['get', 'railInk'], 'text-halo-color': ['get', 'railColor'], 'text-halo-width': 3 } });

    // Stop hovered in the sidebar: big ring + name, over everything
    map.addSource('hover-stop', { type: 'geojson', data: fc([]) });
    map.addLayer({ id: 'hover-stop', type: 'circle', source: 'hover-stop',
      paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 7, 15, 11, 18, 14], 'circle-color': '#ffffff',
        'circle-stroke-color': ['get', 'color'], 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5] } });
    map.addLayer({ id: 'hover-stop-label', type: 'symbol', source: 'hover-stop',
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-anchor': 'left', 'text-offset': [1.4, 0],
        'text-max-width': 14, 'text-allow-overlap': true, 'text-ignore-placement': true },
      paint: { 'text-color': '#2b2f38', 'text-halo-color': '#ffffff', 'text-halo-width': 2 } });

    // Selected stop
    map.addSource('pin', { type: 'geojson', data: fc([]) });
    // Selected stop: the dot, bigger, white with a thick ring in the bus colour
    map.addLayer({ id: 'pin-halo', type: 'circle', source: 'pin',
      paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 6, 15, 10, 18, 12], 'circle-color': '#ffffff',
        'circle-stroke-color': STOP, 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 4.5] } });
    // Own label, pushed past the ring (the regular stop layer skips this stop)
    map.addLayer({ id: 'pin-icon', type: 'symbol', source: 'pin',
      layout: { 'text-field': ['step', ['zoom'], shortLabel, 16, nameAndCode], 'text-font': ['Noto Sans Bold'],
        'text-size': ['step', ['zoom'], 11, 16, 12.5], 'text-anchor': 'left', 'text-justify': 'left', 'text-offset': [1.3, 0],
        'text-max-width': 14, 'text-line-height': 1.1, 'text-allow-overlap': true },
      paint: { 'text-color': STOP, 'text-halo-color': '#ffffff', 'text-halo-width': 1.2 } });

    // Searched place: red dot + its name, inside a faint ring of the walk radius
    map.addSource('place', { type: 'geojson', data: fc([]) });
    // WALK metres in px: 512px tiles → m/px = 40075017·cos(lat) / (512·2^z). cos(~4°) is close enough for MY
    const ringPx = WALK * 512 / (40075017 * Math.cos(4 * Math.PI / 180));
    map.addLayer({ id: 'place-ring', type: 'circle', source: 'place',
      paint: { 'circle-radius': ['interpolate', ['exponential', 2], ['zoom'], 0, ringPx, 22, ringPx * 2 ** 22],
        'circle-color': PLACE, 'circle-opacity': 0.05, 'circle-stroke-color': PLACE, 'circle-stroke-width': 1.5, 'circle-stroke-opacity': 0.35 } });
    map.addLayer({ id: 'place-dot', type: 'circle', source: 'place',
      paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 6, 16, 9], 'circle-color': PLACE,
        'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });
    map.addLayer({ id: 'place-label', type: 'symbol', source: 'place',
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-anchor': 'top', 'text-offset': [0, 1],
        'text-max-width': 12, 'text-allow-overlap': true, 'text-ignore-placement': true },
      paint: { 'text-color': PLACE, 'text-halo-color': '#ffffff', 'text-halo-width': 2 } });

    // Live buses, on top of everything: marker turned to the heading, route number from street level
    map.addImage('live-bus', busIcon, { sdf: true, pixelRatio: 2 });
    map.addSource('buses', { type: 'geojson', data: fc([]) });
    map.addLayer({ id: 'buses', type: 'symbol', source: 'buses',
      layout: {
        'icon-image': 'live-bus', 'icon-size': ['interpolate', ['linear'], ['zoom'], 10, 0.55, 14, 1, 17, 1.3],
        'icon-rotate': ['get', 'bearing'], 'icon-rotation-alignment': 'map',
        'icon-allow-overlap': true, 'icon-ignore-placement': true,
        'text-field': ['step', ['zoom'], '', 13, ['get', 'no']], 'text-font': ['Noto Sans Bold'], 'text-size': 11,
        'text-offset': [0, 1.3], 'text-anchor': 'top', 'text-optional': true, 'text-allow-overlap': false,
      },
      paint: { 'icon-color': ['get', 'color'], 'icon-halo-color': '#ffffff', 'icon-halo-width': 2,
        'text-color': ['get', 'color'], 'text-halo-color': '#ffffff', 'text-halo-width': 1.5 } });

    document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
  });

  /** @param {[number, number][]} coords @param {Record<string, unknown>} props */
  const line = (coords, props) => /** @type {GeoJSON.Feature} */ ({ type: 'Feature', properties: props, geometry: { type: 'LineString', coordinates: coords } });
  /** @param {number} i @param {Record<string, unknown>} props */
  const point = (i, props = {}) => {
    const s = /** @type {Region} */ (data?.region).stops[i];
    return /** @type {GeoJSON.Feature} */ ({ type: 'Feature', properties: { i, name: s[2], code: s[3], ...props }, geometry: { type: 'Point', coordinates: [s[0], s[1]] } });
  };

  // Gradient along the line, kept in the route's own hue: colour → lighter tint → colour
  // (line-gradient can't read feature props, so it's set per selection)
  function gradient(/** @type {string} */ hex) {
    const n = parseInt(hex.slice(1), 16);
    const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => v / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    const h = !d ? 0 : max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    const tint = `hsl(${Math.round((h * 60 + 360) % 360)} ${Math.round(s * 100)}% ${Math.round(Math.min(l + 0.22, 0.75) * 100)}%)`;
    return ['interpolate', ['linear'], ['line-progress'], 0, hex, 0.5, tint, 1, hex];
  }
  const tint = (/** @type {string} */ hex) => { if (map.getLayer('sel-line')) map.setPaintProperty('sel-line', 'line-gradient', gradient(hex)); };

  function drawRegion() {
    if (!data) return;
    source('stops').setData(fc(data.region.stops.map((_, i) => point(i))));
    // Mark the current city's area (the expressions compare against its id)
    const { id } = data.region;
    for (const [k, v] of Object.entries(areaFill(id))) map.setPaintProperty('area-fill', k, v);
    map.setPaintProperty('area-line', 'line-color', areaColor(id));
    map.setPaintProperty('area-line', 'line-opacity', areaLineOpacity(id));
    map.setFilter('area-label', ['!=', ['get', 'id'], id]);
  }

  /** The colour most buses at a stop share — all their lines use it, so the map stays calm */
  function stopColor(/** @type {number} */ stop) {
    if (!data) return STOP;
    const counts = /** @type {Map<string, number>} */ (new Map());
    for (const s of data.stopServices[stop]) { const c = colorOf(data.region.services[s]); counts.set(c, (counts.get(c) ?? 0) + 1); }
    return [...counts].sort((a, b) => b[1] - a[1])[0]?.[0] ?? STOP;
  }

  /** All buses through a stop in one colour; `focus` (a service) keeps its own colour, the rest fade */
  let showAll = false; // stop view: "Show all passing routes" toggled on
  function stopLines(/** @type {number} */ stop, focus = -1) {
    if (!data) return [];
    const { region, lines, stopServices } = data;
    const color = stopColor(stop);
    tint(focus >= 0 ? colorOf(region.services[focus]) : color);
    return stopServices[stop]
      .flatMap((s) => lines[s].map((coords) => line(coords, { svc: s, no: region.services[s].no, thin: true, color: s === focus ? colorOf(region.services[s]) : color, dim: focus >= 0 && s !== focus })))
      .sort((a, b) => Number(b.properties?.dim) - Number(a.properties?.dim));
  }

  /** Selected stop: drawn by the pin layers, hidden from the regular stop layers */
  function setPin(/** @type {number} */ stop) {
    source('pin').setData(fc(stop >= 0 ? [point(stop)] : []));
    // Pin takes the stop's bus colour, same as its lines
    map.setPaintProperty('pin-halo', 'circle-stroke-color', stop >= 0 ? stopColor(stop) : STOP);
    pinned = stop;
    hideStops();
  }

  // Pinned and hovered stops draw themselves (with their own label), so every other stop layer skips them
  let pinned = -1, hoveredStop = -1;
  /** @type {number[]} stops of the bus being viewed (drawn by the route layers) */
  let onRoute = [];
  function hideStops() {
    const without = (/** @type {number[]} */ ids) => {
      const skip = ids.filter((i) => i >= 0);
      return skip.length ? ['!', ['in', ['get', 'i'], ['literal', skip]]] : null;
    };
    for (const id of ['stops', 'stops-icon']) map.setFilter(id, without([pinned, hoveredStop, ...onRoute]));
    const others = without([pinned, hoveredStop]);
    map.setFilter('sel-stops-dot', others);
    const routeLabels = ['any', ['get', 'end'], ['>=', ['zoom'], 15]];
    map.setFilter('sel-stops-label', others ? ['all', routeLabels, others] : routeLabels);
  }

  function drawSelection() {
    if (!data) return;
    hovered = -1;
    const { region, lines, stopServices } = data;
    /** @type {GeoJSON.Feature[]} */ let sel = [];
    /** @type {GeoJSON.Feature[]} */ let selStops = [];

    if (view.kind === 'service') {
      const svc = region.services[view.svc];
      const color = colorOf(svc);
      const dir = view.dir;
      tint(color);
      sel = lines[view.svc].map((coords, d) => line(coords, { color, dim: d !== dir }))
        .sort((a, b) => Number(b.properties?.dim) - Number(a.properties?.dim));
      const p = svc.patterns[dir];
      // A loop ends where it starts: label that terminal once
      const last = p.stops.length - 1;
      const loopBack = region.stops[p.stops[last]][2] === region.stops[p.stops[0]][2];
      selStops = p.stops.map((s, k) => point(s, { color, end: k === 0 || (k === last && !loopBack) }));
    } else if (view.kind === 'stop') {
      // No lines by default: the rider asks (button) or points at a bus (hover)
      sel = showAll ? stopLines(view.stop) : [];
    }
    source('sel').setData(fc(sel));
    source('sel-stops').setData(fc(selStops));
    setPin(view.kind === 'stop' ? view.stop : -1);
    // The place marker stays while you look at stops/buses opened from it
    const place = view.kind === 'place' ? view.place : view.kind === 'home' ? null : fromPlace;
    source('place').setData(fc(place ? [{ type: 'Feature', properties: { name: place.name }, geometry: { type: 'Point', coordinates: [place.lng, place.lat] } }] : []));
    // Bus view: other stops stay (faded) for context; the route's own stops are drawn by the route layers
    const faded = view.kind === 'service';
    map.setPaintProperty('stops', 'circle-opacity', faded ? 0.45 : 1);
    map.setPaintProperty('stops', 'circle-stroke-opacity', faded ? 0.45 : 1);
    map.setPaintProperty('stops-icon', 'text-opacity', faded ? 0.5 : 1);
    railOpacity(faded ? 0.35 : 1);
    onRoute = view.kind === 'service' ? region.services[view.svc].patterns[view.dir].stops : [];
    hideStops();
    drawBuses();
  }

  /** Padding for fitBounds: flyTo/easeTo leave theirs on the map and fitBounds adds to it, so pass only the difference */
  function fitPad() {
    const want = pad(), has = map.getPadding();
    return { top: want.top - (has.top ?? 0), bottom: want.bottom - (has.bottom ?? 0), left: want.left - (has.left ?? 0), right: want.right - (has.right ?? 0) };
  }

  /** @param {[number, number][]} coords @param {number} maxZoom @param {import('maplibre-gl').FitBoundsOptions} opts */
  function fitCoords(coords, maxZoom = 16, opts = {}) {
    if (!coords.length) return;
    const b = new maplibregl.LngLatBounds(coords[0], coords[0]);
    for (const c of coords) b.extend(c);
    map.fitBounds(b, { padding: fitPad(), maxZoom, duration: 700, ...opts });
  }

  // ---------- Place search (local Nominatim) ----------

  /** @typedef {{ lines: { id: string, name: string, mode: string, color: string, pieces: { c: GeoJSON.Position[], s: number, n: number }[] }[], stations: { name: string, lng: number, lat: number, lines: string[], mode: string }[] }} Transit */
  /** @typedef {{ lat: string, lon: string, name: string, display_name: string, category: string, type: string }} NominatimHit */
  /** OSM's bus stops (our stop search covers them) and train stop positions (the station itself is kept) bury real places */
  const isBusStop = (/** @type {NominatimHit} */ h) => (h.category === 'highway' && h.type === 'bus_stop')
    || (h.category === 'railway' && h.type === 'stop')
    || (h.category === 'public_transport' && (h.type === 'platform' || h.type === 'stop_position'));

  const NOMINATIM = 'http://localhost:8088/search';
  /** Latest results. `down` = server off or still importing: back off for a while instead of retrying every keystroke */
  const places = {
    term: '',
    /** @type {Place[]} */ hits: [],
    /** @type {'idle' | 'loading' | 'ok' | 'down'} */ status: 'idle',
  };
  let placeCtl = new AbortController(), placeTimer = 0, downUntil = 0;

  /** Nominatim hit → Place: its name plus a short "street, area" line */
  function toPlace(/** @type {NominatimHit} */ h) {
    const parts = h.display_name.split(', ').filter((p) => p !== 'Malaysia' && !/^\d{5}$/.test(p));
    const name = h.name || parts[0];
    return { name, detail: parts.filter((p) => p !== name).slice(0, 3).join(', '), lng: +h.lon, lat: +h.lat };
  }

  /** Debounced lookup; each keystroke cancels the previous request */
  function searchPlaces(/** @type {string} */ term) {
    clearTimeout(placeTimer);
    placeCtl.abort();
    if (term.length < 3) { places.term = ''; places.hits = []; places.status = 'idle'; return; }
    if (term === places.term && places.status === 'ok') return;
    if (Date.now() < downUntil) { places.hits = []; places.status = 'down'; return; }
    places.status = 'loading';
    const ctl = (placeCtl = new AbortController());
    placeTimer = setTimeout(async () => {
      // Bias (not limit) to the current city: other places still show up, just ranked lower
      const [w, s, e, n] = regions.find((r) => r.id === regionId)?.bounds ?? regions[0].bounds;
      const params = new URLSearchParams({ q: term, format: 'jsonv2', countrycodes: 'my', limit: '12', viewbox: `${w},${n},${e},${s}`, 'accept-language': 'en' });
      try {
        const res = await fetch(`${NOMINATIM}?${params}`, { signal: AbortSignal.any([ctl.signal, AbortSignal.timeout(5000)]) });
        if (!res.ok) throw new Error(`Nominatim ${res.status}`);
        /** @type {NominatimHit[]} */
        const hits = await res.json();
        places.hits = hits.filter((h) => !isBusStop(h)).slice(0, 6).map(toPlace);
        places.status = 'ok';
      } catch {
        if (ctl.signal.aborted) return; // a newer keystroke took over
        places.hits = [];
        places.status = 'down';
        downUntil = Date.now() + 30_000;
      }
      places.term = term;
      if (view.kind === 'home' && q.value.trim().toLowerCase() === term) renderHome();
    }, 300);
  }

  /** Is (x, y) inside a polygon ring? (ray casting) */
  function inRing(/** @type {GeoJSON.Position[]} */ ring, /** @type {number} */ x, /** @type {number} */ y) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  /** City serving a place: inside its stops' walk area first (some city boxes overlap), else its box. Current city wins ties */
  function regionAt(/** @type {Place} */ { lng, lat }) {
    const ordered = [...regions].sort((a, b) => Number(b.id === regionId) - Number(a.id === regionId));
    return ordered.find((r) => r.area.some(([outer, ...holes]) => inRing(outer, lng, lat) && !holes.some((h) => inRing(h, lng, lat))))
      ?? ordered.find(({ bounds: [w, s, e, n] }) => lng >= w && lng <= e && lat >= s && lat <= n);
  }

  function openPlace(/** @type {Place} */ place) {
    const home = regionAt(place);
    if (home && home.id !== regionId) setRegion(home.id, { kind: 'place', place });
    else go({ kind: 'place', place });
  }

  /** Straight-line metres (equirectangular: plenty accurate at walking range) */
  function metres(/** @type {Place} */ { lng, lat }, /** @type {Stop} */ [sLng, sLat]) {
    const k = Math.PI / 180;
    return Math.hypot((sLng - lng) * k * Math.cos(((lat + sLat) / 2) * k), (sLat - lat) * k) * 6371000;
  }

  /** Stops within WALK of a place, nearest first; if none, just the single nearest */
  function nearStops(/** @type {Place} */ place) {
    if (!data) return [];
    const all = data.region.stops.map((s, i) => ({ i, d: metres(place, s) })).sort((a, b) => a.d - b.d);
    const near = all.filter(({ d }) => d <= WALK);
    return near.length ? near : all.slice(0, 1);
  }

  const distance = (/** @type {number} */ d) => (d < 1000 ? `${Math.round(d / 10) * 10} m` : `${(d / 1000).toFixed(1)} km`);

  // ---------- Panel views ----------

  /** Small badges for a list of services, all of them (they wrap) */
  // ---------- Rail transfers ----------

  /** @type {Transit | null} */
  let transit = null;
  const WALK_TO_RAIL = 300; // m
  /** Short code riders see on signage */
  const RAIL_CODE = /** @type {Record<string, string>} */ ({ PH: 'SP', KGL: 'KG', PYL: 'PY' });
  const railCode = (/** @type {Transit['lines'][number]} */ l) =>
    l.mode === 'komuter' ? 'KTM' : l.mode === 'ferry' ? 'Ferry' : l.mode === 'ets' ? 'ETS' : RAIL_CODE[l.id] ?? l.id;
  /** Light line colours (MRT yellow) need dark text */
  const inkOn = (/** @type {string} */ hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    return 0.299 * r + 0.587 * g + 0.114 * b > 170 ? '#1d1d1f' : '#fff';
  };

  const KTM = '#1c4c9c';
  /** Komuter lines share one chip, so it gets KTM's brand blue rather than one line's colour */
  const chipStyle = (/** @type {Transit['lines'][number]} */ l) => {
    const c = l.mode === 'komuter' ? KTM : l.color;
    return `--c:${c};color:${inkOn(c)}`;
  };

  /** Rail/ferry lines at stations within a short walk of a stop, nearest first */
  function railNear(/** @type {number} */ stop) {
    if (!transit || !data) return [];
    const s = data.region.stops[stop];
    /** @type {Map<string, { line: Transit['lines'][number], station: string, d: number }>} */
    const found = new Map();
    const near = transit.stations
      .map((st) => ({ st, d: metres({ name: st.name, detail: '', lng: st.lng, lat: st.lat }, s) }))
      .filter(({ d }) => d <= WALK_TO_RAIL)
      .sort((a, b) => a.d - b.d);
    for (const { st, d } of near) {
      for (const id of st.lines) {
        const line = transit.lines.find((l) => l.id === id);
        // One chip per code: a station on two Komuter lines is still just "KTM"
        if (line && !found.has(railCode(line))) found.set(railCode(line), { line, station: st.name, d });
      }
    }
    return [...found.values()];
  }

  function railChips(/** @type {number} */ stop) {
    return railNear(stop).map(({ line, station, d }) =>
      `<span class="rail" style="${chipStyle(line)}" title="${escapeHtml(`${line.name} · ${station} · ${Math.round(d / 10) * 10} m`)}">${railCode(line)}</span>`).join('');
  }

  /** Stop panel: each nearby line with its station and walk */
  function railList(/** @type {number} */ stop) {
    const near = railNear(stop);
    if (!near.length) return '';
    const byStation = Map.groupBy(near, (n) => n.station);
    return `<div class="rail-list">${[...byStation].map(([station, ls]) =>
      `<div>${ls.map(({ line }) => `<span class="rail" style="${chipStyle(line)}">${railCode(line)}</span>`).join(' ')}
        ${escapeHtml(station)} <span class="s">· ${distance(ls[0].d)} walk</span></div>`).join('')}</div>`;
  }

  function badges(/** @type {number[]} */ svcs) {
    if (!data || !svcs.length) return '';
    const { services } = data.region;
    return `<div class="others">${svcs.map((s) => badge(services[s], 'sm')).join('')}</div>`;
  }

  /** Transfers at a stop on a route: rail first, then other buses */
  function transfers(/** @type {number} */ stop, /** @type {number[]} */ svcs) {
    const rail = railChips(stop);
    if (!rail) return badges(svcs);
    const { services } = /** @type {Region} */ (data?.region);
    return `<div class="others">${rail}${svcs.map((s) => badge(services[s], 'sm')).join('')}</div>`;
  }

  function renderHome() {
    if (!data) return;
    const { region, stopServices } = data;
    const term = q.value.trim().toLowerCase();
    // Legend only when riders would see different brands
    const brands = [...new Map(region.operators.map((o) => [o.name, o])).values()];
    const ops = brands.length > 1
      ? brands.map((o) => `<span class="op-key"><i style="background:${o.color}"></i>${escapeHtml(o.name)}</span>`).join('')
      : '';

    const services = region.services
      .map((svc, i) => ({ svc, i }))
      .filter(({ svc }) => !term || svc.no.toLowerCase().includes(term) || svc.name.toLowerCase().includes(term))
      .sort((a, b) => (term ? Number(!a.svc.no.toLowerCase().startsWith(term)) - Number(!b.svc.no.toLowerCase().startsWith(term)) : 0));

    const stops = term.length < 2 ? [] : region.stops
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => s[2].toLowerCase().includes(term) || s[3].toLowerCase().startsWith(term))
      .slice(0, 60);

    const svcRows = services.map(({ svc, i }) => `
      <button class="row" data-svc="${i}">
        ${badge(svc)}
        <div class="main"><div class="t wrap">${escapeHtml(svc.name)}</div></div>
      </button>`).join('');
    const stopRows = stops.map(({ s, i }) => `
      <button class="row" data-stop="${i}">
        <span class="stop-icon"></span>
        <div class="main"><div class="t">${escapeHtml(s[2])}</div>
        ${s[3] ? `<div class="s">${stopCode(s)}</div>` : ''}</div>
      </button>`).join('');

    // Places: last results stay up while the next query loads, so the list doesn't flicker per keystroke
    const hits = term.length >= 3 ? places.hits : [];
    const placeRows = hits.map((p, k) => {
      const other = regionAt(p);
      return `
      <button class="row" data-place="${k}">
        <span class="place-icon"></span>
        <div class="main"><div class="t">${escapeHtml(p.name)}</div>
        <div class="s">${other && other.id !== regionId ? `${escapeHtml(other.name)} · ` : ''}${escapeHtml(p.detail)}</div></div>
      </button>`;
    }).join('');
    const empty = !services.length && !stops.length && !hits.length
      ? term.length >= 3 && places.status === 'loading' ? '<div class="empty">Searching places…</div>'
      : `<div class="empty">Nothing matches “${escapeHtml(q.value)}”${places.status === 'down' ? '<div class="note">Place search unavailable</div>' : ''}</div>`
      : '';

    body.innerHTML = (stops.length ? `<h3 class="section-title">Stops</h3>${stopRows}` : '')
      + (services.length ? `<h3 class="section-title">${term ? 'Buses' : `${services.length} buses`} ${ops}</h3>${svcRows}` : '')
      + (hits.length ? `<h3 class="section-title">Places</h3>${placeRows}` : '')
      + empty;
  }

  function renderService(/** @type {number} */ svcIdx, /** @type {number} */ dir) {
    if (!data) return;
    const { region, stopServices } = data;
    const svc = region.services[svcIdx];
    const p = svc.patterns[dir];
    const color = colorOf(svc);
    const hw = headway(p);
    const dirs = svc.patterns.length > 1
      ? `<div class="dirs">${svc.patterns.map((pt, d) => `
          <button class="${d === dir ? 'active' : ''}" data-dir="${d}"><span>${pt.loop ? 'Loop via' : 'To'} <b>${escapeHtml(pt.to)}</b>${pt.loop ? '' : escapeHtml(viaOf(svc))}</span></button>`).join('')}</div>`
      : ''; // one direction: the title already says where it goes

    const rows = p.stops.map((s, k) => {
      const st = region.stops[s];
      const others = stopServices[s].filter((o) => o !== svcIdx);
      return `<li class="${k === 0 || k === p.stops.length - 1 ? 'end' : ''}">
        <button class="row" data-stop="${s}">
          <div class="main"><div class="t">${escapeHtml(st[2])}${st[3] ? ` <span class="code">${escapeHtml(st[3])}</span>` : ''}</div>${transfers(s, others)}</div>
        </button></li>`;
    }).join('');

    body.innerHTML = `
      <div class="detail-head">
        <button class="close-x" data-back aria-label="Close">✕</button>
        <div class="title-row">${badge(svc, 'lg')}<div><h2>${escapeHtml(svc.name)}</h2><div class="op">${escapeHtml(region.operators[svc.op].name)}</div></div></div>
        ${dirs}
        <div class="facts">
          <div class="fact"><b>${clock(p.first)}</b><span>First bus</span></div>
          <div class="fact"><b>${clock(p.last)}</b><span>Last bus</span></div>
          <div class="fact"><b>${hw ? `~${hw} min` : '—'}</b><span>Every</span></div>
        </div>
        ${runningNote(p).startsWith('Ended') ? `<div class="note"><span class="off ended">Ended for today</span></div>` : ''}
        <div class="toggle-row">
          <div class="note">${p.stops.length} stops${p.mins ? ` · ~${p.mins[p.mins.length - 1]} min end to end` : ''}</div>
          <button class="chip-btn" data-fly>▶\uFE0E Fly along</button>
        </div>
      </div>
      <ol class="timeline" style="--c:${color}">${rows}</ol>`;
  }

  function renderStop(/** @type {number} */ stopIdx) {
    if (!data) return;
    const { region, stopServices } = data;
    const st = region.stops[stopIdx];
    const passing = stopServices[stopIdx];
    const rows = passing.map((svcIdx) => {
      const svc = region.services[svcIdx];
      // Directions that serve this stop (not as their last stop)
      const dirs = svc.patterns.map((p, d) => ({ p, d, k: p.stops.indexOf(stopIdx) })).filter(({ p, k }) => k >= 0 && k < p.stops.length - 1);
      const main = dirs[0] ?? { p: svc.patterns[0], d: 0, k: 0 };
      const toText = dirs.length ? dirs.map(({ p }) => `${p.loop ? 'Loop via' : 'To'} ${escapeHtml(p.to)}${p.loop ? '' : escapeHtml(viaOf(svc))}`).join(' · ') : 'Ends here';
      const every = headway(main.p);
      return `<button class="row" data-svc="${svcIdx}" data-dir="${main.d}">
          ${badge(svc)}
          <div class="main"><div class="t wrap">${toText}</div></div>
          ${every ? `<span class="every">every ${every} min</span>` : ''}
        </button>`;
    }).join('');

    body.innerHTML = `
      <div class="detail-head">
        <button class="close-x" data-back aria-label="Close">✕</button>
        <div class="title-row">
          <div><h2>${escapeHtml(st[2])}</h2>${st[3] ? `<div class="op"><span class="code-tag">${escapeHtml(st[3])}</span></div>` : ''}</div></div>
        ${railList(stopIdx)}
        ${passing.length ? `<button class="chip-btn" data-passing aria-pressed="${showAll}">${showAll ? 'Hide' : 'Show all'} passing routes</button>` : ''}
      </div>
      ${rows || '<div class="empty">No buses</div>'}`;
  }

  function renderPlace(/** @type {Place} */ place) {
    if (!data) return;
    const { region, stopServices } = data;
    const near = nearStops(place);
    const walkable = near.filter(({ d }) => d <= WALK).length;
    const rows = near.map(({ i, d }) => {
      const st = region.stops[i];
      return `<button class="row near" data-stop="${i}">
          <span class="stop-icon"></span>
          <div class="main"><div class="t">${escapeHtml(st[2])}</div>
            ${st[3] ? `<div class="s">${stopCode(st)}</div>` : ''}
            ${badges(stopServices[i])}
          </div>
          <span class="dist">${distance(d)}</span>
        </button>`;
    }).join('');

    body.innerHTML = `
      <div class="detail-head">
        <button class="close-x" data-back aria-label="Close">✕</button>
        <div class="title-row"><span class="place-icon" style="width:34px;height:34px"></span>
          <div><h2>${escapeHtml(place.name)}</h2>${place.detail ? `<div class="op">${escapeHtml(place.detail)}</div>` : ''}</div></div>
        ${walkable ? '' : `<div class="note">No bus stops within ${WALK} m. Nearest one:</div>`}
      </div>
      <h3 class="section-title">${walkable ? `${walkable} stop${walkable === 1 ? '' : 's'} within ${WALK} m` : 'Nearest stop'}</h3>
      ${rows}`;
  }

  function render() {
    clearBtn.hidden = !q.value;
    if (view.kind === 'service') renderService(view.svc, view.dir);
    else if (view.kind === 'stop') renderStop(view.stop);
    else if (view.kind === 'place') renderPlace(view.place);
    else renderHome();
    body.scrollTop = 0;
  }

  // ---------- Navigation (hash = shareable state) ----------

  let regionId = regions[0].id;

  function writeHash() {
    if (!data) return;
    const tail = view.kind === 'service' ? `/bus/${encodeURIComponent(data.keys[view.svc])}${view.dir ? '/2' : ''}${tour ? '/fly' : ''}`
      : view.kind === 'stop' ? `/stop/${encodeURIComponent(data.stopKeys[view.stop])}`
      : view.kind === 'place' ? `/place/${view.place.lat.toFixed(5)},${view.place.lng.toFixed(5)}/${encodeURIComponent(view.place.name)}` : '';
    history.replaceState(null, '', `#/${regionId}${tail}`);
  }

  /** @param {View} next @param {{ fly?: boolean }} opts */
  let peeked = -1, peekedSvc = -1;
  function peekStop(/** @type {number} */ stop) {
    if (!data) return;
    peeked = stop; // zoom only (no highlight); the stop is selected on the 2nd tap
    const s = data.region.stops[stop];
    map.flyTo({ center: [s[0], s[1]], zoom: Math.max(map.getZoom(), 17), padding: pad(), duration: 600 });
  }

  let fromStop = -1; // stop a bus was opened from, so ✕ returns there
  /** @type {Place | null} place a stop was opened from (kept through its buses), so ✕ returns there */
  let fromPlace = null;
  function go(next, { fly = true } = {}) {
    stopTour();
    peeked = peekedSvc = -1;
    showAll = false;
    if (next.kind === 'service') fromStop = view.kind === 'stop' ? view.stop : view.kind === 'service' ? fromStop : -1;
    if (next.kind === 'stop') fromPlace = view.kind === 'place' ? view.place : view.kind === 'service' ? fromPlace : null;
    else if (next.kind !== 'service') fromPlace = null;
    view = next;
    render();
    drawSelection();
    writeHash();
    if (!data || !fly) return;
    if (view.kind === 'service') {
      fitCoords(data.lines[view.svc][view.dir]);
    } else if (view.kind === 'stop') {
      const s = data.region.stops[view.stop];
      map.flyTo({ center: [s[0], s[1]], zoom: Math.max(map.getZoom(), 15.5), padding: pad(), duration: 700 });
    } else if (view.kind === 'place') {
      const { place } = view, { stops } = data.region;
      // Frame the place with the stops listed (or the lone nearest one)
      fitCoords([[place.lng, place.lat], ...nearStops(place).map(({ i }) => /** @type {[number, number]} */ ([stops[i][0], stops[i][1]]))], 16.5);
    }
  }

  async function setRegion(/** @type {string} */ id, /** @type {View} */ next = { kind: 'home' }, fit = true) {
    stopTour();
    regionId = id;
    regionBtn.textContent = regions.find((r) => r.id === id)?.name ?? '';
    for (const b of cityMenu.querySelectorAll('[data-city]')) b.setAttribute('aria-selected', String((/** @type {HTMLElement} */ (b)).dataset.city === id));
    loading.hidden = false;
    const region = await loadRegion(id);
    await mapReady;
    loading.hidden = true;
    if (regionId !== id) return; // switched again while loading
    data = index(region);
    document.documentElement.style.setProperty('--accent', region.operators[0].color);
    drawRegion();
    syncLive();
    if (fit && next.kind === 'home') map.fitBounds(region.bounds, { padding: fitPad(), duration: 0 });
    go(next, { fly: next.kind !== 'home' });
  }

  function fromHash() {
    const [, id, kind, key, dir] = location.hash.split('/');
    const meta = regions.find((r) => r.id === id) ?? regions[0];
    // `dir` is the bus direction, or a place's name in #/<city>/place/<lat>,<lng>/<name>
    return { id: meta.id, kind, key: key ? decodeURIComponent(key) : '', dir: dir === '2' ? 1 : 0, name: dir ? decodeURIComponent(dir) : '', fly: location.hash.endsWith('/fly') };
  }

  /** Resolve a hash key once the region is loaded */
  async function openFromHash() {
    const h = fromHash();
    const region = await loadRegion(h.id);
    const { keys, stopKeys } = index(region);
    const svc = keys.indexOf(h.key);
    const stop = stopKeys.indexOf(h.key);
    const [lat, lng] = h.key.split(',').map(Number);
    /** @type {View} */
    const next = h.kind === 'bus' && svc >= 0 ? { kind: 'service', svc, dir: Math.min(h.dir, region.services[svc].patterns.length - 1) }
      : h.kind === 'stop' && stop >= 0 ? { kind: 'stop', stop }
      : h.kind === 'place' && Number.isFinite(lat) && Number.isFinite(lng) ? { kind: 'place', place: { name: h.name || 'Dropped pin', detail: '', lat, lng } }
      : { kind: 'home' };
    await setRegion(h.id, next);
    if (h.fly) startTour();
  }

  // ---------- Live buses (data.gov.my GTFS Realtime) ----------

  // Only Rapid KL publishes positions we can match to routes; the feed refreshes every 30 s
  const LIVE = {
    region: 'klang-valley',
    feeds: ['rapid-bus-kl', 'rapid-bus-mrtfeeder'],
    url: (/** @type {string} */ feed) => `https://api.data.gov.my/gtfs-realtime/vehicle-position/prasarana/?category=${feed}`,
    every: 30_000,
    staleAfter: 120, // seconds: older pings are parked or offline buses
  };

  /** @typedef {{ no: number, num: number, bytes: Uint8Array }} Field */
  /** Minimal protobuf reader (saves a decoder library): one entry per field, `num` for numbers, `bytes` for strings/sub-messages */
  function* fields(/** @type {Uint8Array} */ buf) {
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const none = new Uint8Array(0);
    let i = 0;
    const varint = () => { let v = 0, m = 1, b; do { b = buf[i++]; v += (b & 127) * m; m *= 128; } while (b & 128); return v; };
    while (i < buf.length) {
      const tag = varint(), wire = tag & 7, no = tag >>> 3;
      if (wire === 0) yield /** @type {Field} */ ({ no, num: varint(), bytes: none });
      else if (wire === 2) { const n = varint(); yield /** @type {Field} */ ({ no, num: 0, bytes: buf.subarray(i, i + n) }); i += n; }
      else if (wire === 5) { yield /** @type {Field} */ ({ no, num: dv.getFloat32(i, true), bytes: none }); i += 4; }
      else if (wire === 1) i += 8;
      else return; // groups: not used by GTFS Realtime
    }
  }

  /** FeedMessage → the fields we draw. Numbers below are the field ids in gtfs-realtime.proto */
  function parseVehicles(/** @type {Uint8Array} */ feed) {
    const text = new TextDecoder();
    const out = [];
    for (const entity of fields(feed)) {
      if (entity.no !== 2) continue;
      for (const vehicle of fields(entity.bytes)) {
        if (vehicle.no !== 4) continue;
        const bus = { id: '', route: '', lat: 0, lng: 0, bearing: 0, speed: 0, time: 0 };
        for (const f of fields(vehicle.bytes)) {
          if (f.no === 1) { for (const t of fields(f.bytes)) if (t.no === 5) bus.route = text.decode(t.bytes); }
          else if (f.no === 2) {
            for (const p of fields(f.bytes)) {
              if (p.no === 1) bus.lat = p.num; else if (p.no === 2) bus.lng = p.num;
              else if (p.no === 3) bus.bearing = p.num; else if (p.no === 5) bus.speed = p.num;
            }
          } else if (f.no === 5) bus.time = f.num;
          else if (f.no === 8) { for (const d of fields(f.bytes)) if (d.no === 1) bus.id = text.decode(d.bytes); }
        }
        out.push(bus);
      }
    }
    return out;
  }

  /** @typedef {{ from: [number, number], to: [number, number], bearing: number, speed: number, time: number, svc: number, route: string }} LiveBus */
  /** @type {Map<string, LiveBus>} */
  const buses = new Map();
  let movedAt = 0; // when the last poll landed: buses glide from `from` to `to` until the next one
  let liveTimer = 0, liveFrame = 0;

  /** Where a bus is drawn right now, part-way between its last two pings */
  function busAt(/** @type {LiveBus} */ { from, to }, now = performance.now()) {
    const k = Math.min(1, (now - movedAt) / LIVE.every);
    return /** @type {[number, number]} */ ([from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k]);
  }

  function drawBuses() {
    if (!map.getSource('buses')) return;
    const { services } = data?.region ?? { services: [] };
    const only = view.kind === 'service' ? view.svc : -1; // a bus's page shows just its own buses
    const now = performance.now();
    source('buses').setData(fc([...buses].filter(([, b]) => only < 0 || b.svc === only).map(([id, b]) => {
      const svc = services[b.svc];
      return { type: 'Feature', geometry: { type: 'Point', coordinates: busAt(b, now) },
        properties: { id, svc: b.svc, no: svc?.no ?? b.route, color: svc ? colorOf(svc) : STOP, bearing: b.bearing, speed: Math.round(b.speed), time: b.time } };
    })));
  }

  // ~12 redraws a second while buses glide: smooth enough, and easy on phones
  function animateBuses() {
    cancelAnimationFrame(liveFrame);
    let last = 0;
    const step = (/** @type {number} */ now) => {
      if (now - last > 80) { last = now; drawBuses(); }
      if (now - movedAt < LIVE.every && buses.size) liveFrame = requestAnimationFrame(step);
    };
    liveFrame = requestAnimationFrame(step);
  }

  async function pollBuses() {
    const region = data?.region;
    if (region?.id !== LIVE.region) return;
    // Rapid KL pings carry the GTFS route id ("U2500"); feeder pings carry the bus number ("T460", "T155 Inbound")
    const byId = new Map(region.services.flatMap((s, i) => [[s.no, i], [s.id, i]]));
    const feeds = await Promise.all(LIVE.feeds.map((f) => fetch(LIVE.url(f)).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null)));
    if (data?.region !== region) return; // city changed while loading
    if (feeds.every((f) => !f)) return; // offline: keep what we have
    const now = performance.now(), fresh = Date.now() / 1000 - LIVE.staleAfter;
    const seen = new Set();
    let unmatched = 0;
    for (const feed of feeds) {
      if (!feed) continue;
      for (const v of parseVehicles(new Uint8Array(feed))) {
        if (!v.id || !v.lat || !v.lng || v.time < fresh) continue; // GPS glitches report 0,0
        const svc = byId.get(v.route) ?? byId.get(v.route.split(' ')[0]) ?? -1;
        if (svc < 0) unmatched++;
        const old = buses.get(v.id);
        const to = /** @type {[number, number]} */ ([v.lng, v.lat]);
        // Glide from where it is drawn now; a new bus (or a GPS jump of ~1 km+) just appears in place
        const at = old ? busAt(old, now) : to;
        const from = Math.abs(at[0] - to[0]) + Math.abs(at[1] - to[1]) < 0.01 ? at : to;
        buses.set(v.id, { from, to, bearing: v.bearing, speed: v.speed, time: v.time, svc, route: v.route });
        seen.add(v.id);
      }
    }
    for (const id of buses.keys()) if (!seen.has(id)) buses.delete(id);
    if (unmatched) console.info(`Live buses: ${unmatched} of ${buses.size} on routes this map doesn't have`);
    movedAt = now;
    animateBuses();
  }

  /** Poll only while it's worth it: Klang Valley on screen, tab visible */
  function syncLive() {
    clearInterval(liveTimer);
    const on = regionId === LIVE.region && !document.hidden;
    if (on) { pollBuses(); liveTimer = setInterval(pollBuses, LIVE.every); }
    if (regionId !== LIVE.region) { buses.clear(); drawBuses(); }
  }
  document.addEventListener('visibilitychange', syncLive);

  // ---------- Flyover: a 3D night flight along the bus's route, the line drawing itself stop by stop ----------

  const TOUR = {
    zoom: 17.2, pitch: 68,
    pull: 0.6, // zoom levels the camera pulls back each time the speed doubles
    lead: 1600, // ms to swoop down to the first stop
    look: 400, // metres ahead the camera faces
    ahead: 120, // metres ahead a stop's dot is put on the map (× the speed setting)
    nose: 25, // metres of road ahead the bus marker points along
    // Each stop: `zone` metres either side where the bus brakes and pulls away, down to `crawl` × full speed at the stop
    halt: { zone: 50, crawl: 0.15 },
    rail: { zone: 100, crawl: 0.1 }, // a stop with a rail transfer: a longer look
    stretch: 250, // metres of open road for each extra 1× of speed…
    top: 2.5, // …up to this limit. The camera pulls back as it speeds up, so the ground never rushes by
    perKm: 6, // ms per metre (= seconds per km) at 1×, between stops
    hold: 1500, // ms at the last stop before the map comes back
  };
  const NIGHT = {
    land: '#0a1020', water: '#04070f', road: '#1e3158', text: '#8ea3cf',
    labels: ['highway-name-major', 'label_town', 'label_city', 'label_city_capital'], // the only basemap names kept, dimmed
    // A horizon to fly towards; the haze also hides the far, half-loaded tiles
    sky: { 'sky-color': '#060b1a', 'horizon-color': '#2a4f9c', 'fog-color': '#0a1020', 'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.7, 'fog-ground-blend': 0.55, 'atmosphere-blend': 0 },
  };
  const hud = $('tour');

  /** @type {[layer: string, prop: string, value: unknown][]} the daytime paint, to put back after */
  let dayPaint = [];
  /** @type {string[]} basemap name layers hidden for the flight */
  let dayLabels = [];
  function setNight(/** @type {boolean} */ on) {
    for (const [layer, prop, value] of dayPaint) map.setPaintProperty(layer, prop, value);
    for (const id of dayLabels) map.setLayoutProperty(id, 'visibility', 'visible');
    dayPaint = [];
    dayLabels = [];
    for (const id of ['tour-buildings', 'tour-glow', 'tour-rail-ring', 'tour-rail-label']) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    for (const id of ['sel-casing', 'sel-arrows', 'stops', 'stops-icon']) map.setLayoutProperty(id, 'visibility', on ? 'none' : 'visible');
    map.setSky(on ? NIGHT.sky : { 'atmosphere-blend': 0 });
    // Phones: the tilted 3D view is the heaviest thing drawn, so fly at a lower resolution with solid buildings (no second pass)
    const sharp = Math.min(devicePixelRatio, 2);
    if (on && isMobile()) {
      map.setPixelRatio(Math.min(devicePixelRatio, 1.25));
      map.setPaintProperty('tour-buildings', 'fill-extrusion-opacity', 1);
    } else if (!on && map.getPixelRatio() !== sharp) map.setPixelRatio(sharp); // whatever the width is now: the phone may have been turned
    if (!on) return;
    railOpacity(1); // rail lines in full colour: they are the transfers (the bus view fades them again after)
    /** @type {[layer: string, paint: Record<string, string | number>][]} */
    const night = [
      ['sel-line', { 'line-opacity': 1 }],
      ['sel-stops-label', { 'text-color': '#ffffff', 'text-halo-color': NIGHT.land }],
      ['station-label', { 'text-color': '#ffffff', 'text-halo-color': NIGHT.land }],
    ];
    // The basemap: land and its fills go one dark colour, so only roads, water and buildings read
    for (const l of map.getStyle().layers) {
      if (l.type !== 'background' && !('source' in l && l.source === 'openmaptiles')) continue;
      const wet = l.id.startsWith('water');
      if (l.type === 'background') night.push([l.id, { 'background-color': NIGHT.land }]);
      else if (l.type === 'fill') night.push([l.id, { 'fill-color': wet ? NIGHT.water : NIGHT.land }]);
      else if (l.type === 'line') night.push([l.id, { 'line-color': wet ? NIGHT.water : NIGHT.road }]);
      else if (l.type === 'symbol' && NIGHT.labels.includes(l.id)) night.push([l.id, { 'text-color': NIGHT.text, 'text-halo-color': NIGHT.land, 'text-opacity': 0.6 }]);
      else if (l.type === 'symbol' && map.getLayoutProperty(l.id, 'visibility') !== 'none') {
        // Every other name (neighbourhoods, side streets, lakes, shops) is noise at flying speed
        map.setLayoutProperty(l.id, 'visibility', 'none');
        dayLabels.push(l.id);
      }
    }
    for (const [layer, paint] of night) {
      for (const [prop, value] of Object.entries(paint)) {
        dayPaint.push([layer, prop, map.getPaintProperty(layer, prop)]);
        map.setPaintProperty(layer, prop, value);
      }
    }
  }

  /** @typedef {{ pause: () => void, prev: () => void, next: () => void, rate: () => void }} TourKeys what the bar's buttons do */
  /** @type {{ frame: number, coords: [number, number][], bus: import('maplibre-gl').Marker, keys: TourKeys } | null} */
  let tour = null;
  let tourRate = 1; // 1×, 2× or 4×: kept from one flight to the next

  /** Flies the direction on screen, then the others in turn (`leg` counts them), so a two-way bus goes there and back */
  function startTour(leg = 1) {
    if (!data || view.kind !== 'service') return;
    stopTour();
    const { region, lines, stopServices } = data;
    const svcIdx = view.svc;
    const svc = region.services[svcIdx], dir = view.dir, pattern = svc.patterns[dir], { stops } = pattern;
    const coords = lines[view.svc][view.dir];
    if (coords.length < 2) return;
    const color = colorOf(svc);

    // The line in metres (flat earth: fine at city scale), with the distance travelled at each vertex
    const rad = Math.PI / 180, cos = Math.cos(coords[0][1] * rad);
    const xy = (/** @type {number} */ lng, /** @type {number} */ lat) => [lng * rad * cos * 6371000, lat * rad * 6371000];
    const pts = coords.map(([lng, lat]) => xy(lng, lat));
    const at = [0];
    for (let i = 1; i < pts.length; i++) at.push(at[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const length = at[at.length - 1];

    const pointAt = (/** @type {number} */ d) => {
      let i = 1;
      while (i < at.length - 1 && at[i] < d) i++;
      const k = Math.max(0, Math.min(1, (d - at[i - 1]) / (at[i] - at[i - 1] || 1)));
      const a = coords[i - 1], b = coords[i];
      return /** @type {[number, number]} */ ([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    };
    /** Compass heading of the road ahead (at the end: of the last stretch) */
    const heading = (/** @type {number} */ d) => {
      const from = Math.max(0, Math.min(d, length - TOUR.look));
      const a = pointAt(from), b = pointAt(from + TOUR.look);
      return Math.atan2((b[0] - a[0]) * cos, b[1] - a[1]) / rad;
    };

    // How far along the line each stop sits: snap it to the nearest stretch, searching on from the stop before
    let seg = 0;
    const stopAt = stops.map((s) => {
      const [x, y] = xy(region.stops[s][0], region.stops[s][1]);
      let best = Infinity, d = at[seg];
      for (let j = seg; j < pts.length - 1; j++) {
        const [ax, ay] = pts[j], dx = pts[j + 1][0] - ax, dy = pts[j + 1][1] - ay;
        const k = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));
        const off = Math.hypot(x - ax - dx * k, y - ay - dy * k);
        if (off < best) { best = off; d = at[j] + (at[j + 1] - at[j]) * k; seg = j; }
        else if (best < 50 && off > 200) break; // passed it: a loop coming back this way must not steal the stop
      }
      return d;
    });
    stopAt[0] = 0; // the first stop is there from the start, even if the line begins a little before it
    // Rail transfers are the highlights: a ring in the line's colour, its code, and a longer halt
    const dots = stops.map((s, k) => {
      const rail = railNear(s);
      if (!rail.length) return point(s, { color, ring: '#ffffff', end: k === 0 || k === stops.length - 1 });
      const railColor = rail[0].line.mode === 'komuter' ? KTM : rail[0].line.color;
      return point(s, { color, ring: railColor, end: true, rail: rail.map((r) => railCode(r.line)).join(' · '), railColor, railInk: inkOn(railColor) });
    });
    /** Like a real bus: brakes into each stop, almost halts, pulls away, and opens up on a long stretch with no stops. 1 = normal speed */
    const paceAt = (/** @type {number} */ d) => {
      let pace = 1, clear = Infinity; // `clear`: metres of open road to the nearest stop's zone
      for (let k = 0; k < stopAt.length; k++) {
        const { zone, crawl } = dots[k].properties?.rail ? TOUR.rail : TOUR.halt;
        const gap = Math.abs(stopAt[k] - d);
        pace = Math.min(pace, crawl + (1 - crawl) * Math.min(1, gap / zone));
        clear = Math.min(clear, Math.max(0, gap - zone));
      }
      return pace < 1 ? pace : Math.min(TOUR.top, 1 + clear / TOUR.stretch);
    };

    /** Draw the line up to `t` (0–1) of its length */
    let drawn = -1;
    const reveal = (/** @type {number} */ t) => {
      // Each change redraws the gradient for every tile the line is in, so skip the ones too small to see (the bus hides the end)
      if (t === drawn || (t < 1 && Math.abs(t - drawn) * length < 2)) return;
      drawn = t;
      // A steep `interpolate`, not `step`: a step gradient is redrawn at up to the largest texture size per tile, far too slow every frame
      for (const id of ['sel-line', 'tour-glow']) map.setPaintProperty(id, 'line-gradient', ['interpolate', ['linear'], ['line-progress'], t, color, t + 1e-6, 'rgba(0, 0, 0, 0)']);
    };
    let shown = 0, dotted = 0;
    const showStops = (/** @type {number} */ d) => {
      let n = 0;
      while (n < stops.length && stopAt[n] <= d) n++;
      // The dots go on the map a little before the bus gets there: map data takes a few frames to land (more on a phone,
      // busy loading the city), and sent on arrival the stop would pop in after the bus had passed
      let m = n;
      while (m < stops.length && stopAt[m] <= d + TOUR.ahead * tourRate) m++;
      if (m !== dotted || n !== shown) {
        dotted = m;
        // The stop the bus is at wears the ring (`here`)
        source('sel-stops').setData(fc(dots.slice(0, m).map((dot, k) => (k !== n - 1 ? dot : { ...dot, properties: { ...dot.properties, here: true } }))));
      }
      if (n === shown) return;
      shown = n;
      const s = stops[shown - 1];
      sound.play(dots[shown - 1].properties?.rail ? 'transfer' : 'arrive');
      const mins = pattern.mins?.[shown - 1];
      $('tour-stop').textContent = region.stops[s][2];
      $('tour-count').textContent = `Stop ${shown} of ${stops.length}${mins ? ` · ${mins} min` : ''} · to ${pattern.to}`;
      // Change here: rail (station + walk) first, then a few of the other buses
      $('tour-change').innerHTML = railList(s) + badges(stopServices[s].filter((o) => o !== svcIdx).slice(0, 8));
    };

    setNight(true);
    document.body.classList.add('touring');
    $('tour-badge').innerHTML = badge(svc);
    hud.hidden = false;
    source('sel').setData(fc([line(coords, { color })]));
    source('sel-stops').setData(fc([]));
    reveal(0);
    showStops(0);

    // The bus leading the line, and what the camera follows. A marker, not a map layer: it moves in the same frame
    // as the camera (layer data goes through a worker and lands a few frames late, which looks jittery)
    const el = document.createElement('div');
    el.className = 'tour-bus';
    el.innerHTML = Array.from({ length: 8 }, (_, z) => `<svg viewBox="0 0 34 46" style="transform: translateZ(${z * 1.5}px)"><path d="M17 0 34 46 17 36 0 46z"/></svg>`).join('');
    const bus = new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map', subpixelPositioning: true }).setLngLat(coords[0]).addTo(map);
    /** Shortest turn from one compass angle to another, in degrees (-180 to 180) */
    const turnTo = (/** @type {number} */ to, /** @type {number} */ from) => ((((to - from) % 360) + 540) % 360) - 180;
    /** Sit at `d`, nose along the next few metres of road (eased, so corners in the data don't snap it round) */
    let nose = NaN;
    const placeBus = (/** @type {number} */ d) => {
      const from = Math.max(0, Math.min(d, length - TOUR.nose));
      const a = pointAt(from), b = pointAt(from + TOUR.nose);
      const road = Math.atan2((b[0] - a[0]) * cos, b[1] - a[1]) / rad;
      nose = Number.isNaN(nose) ? road : nose + turnTo(road, nose) * 0.2;
      bus.setLngLat(pointAt(d)).setRotation(nose);
    };

    // Normal speed, in metres per ms: the same for every route, only slower when a short one would be over in a blink
    const speed = length / Math.max(30_000, length * TOUR.perKm);
    let d = 0, drop = 0, bearing = heading(0), last = performance.now(), endAt = Infinity, paused = false;
    let start = last + TOUR.lead;
    const label = (/** @type {string} */ key, /** @type {string} */ text) => { (/** @type {HTMLElement} */ (hud.querySelector(`[data-tour="${key}"]`))).textContent = text; };
    label('pause', '❚❚');
    label('rate', `${tourRate}×`);
    /** Jump to a stop: the camera faces the road there at once, no long sweep round */
    const seek = (/** @type {number} */ k) => {
      d = stopAt[Math.max(0, Math.min(stops.length - 1, k))];
      bearing = heading(d);
      nose = NaN;
      start = 0; // skips the swoop in
    };
    /** @type {TourKeys} */
    const keys = {
      pause() { paused = !paused; label('pause', paused ? '▶\uFE0E' : '❚❚'); },
      prev: () => seek(shown - 2),
      next: () => seek(shown),
      rate() { tourRate = tourRate >= 4 ? 1 : tourRate * 2; label('rate', `${tourRate}×`); },
    };
    // The bus sits low on screen, so most of the view is the road ahead. On phones the bar covers the bottom: measure above it
    const under = isMobile() ? hud.offsetHeight : 0;
    map.easeTo({ center: coords[0], zoom: TOUR.zoom, pitch: TOUR.pitch, bearing, duration: TOUR.lead,
      padding: { top: (innerHeight - under) * 0.15, bottom: under, left: 0, right: 0 } });

    const step = (/** @type {number} */ now) => {
      if (!tour) return;
      const dt = Math.min(now - last, 50); // a hidden tab or a slow frame pauses the flight instead of skipping ahead
      last = now;
      if (now >= start) {
        const pace = paceAt(d);
        if (!paused) d = Math.min(length, d + speed * pace * tourRate * dt);
        // Faster = further out, so the road never rushes by. Applied as a change to the zoom, so the rider's own zooming stays
        const pull = drop + (TOUR.pull * Math.log2(Math.max(1, pace)) - drop) * (1 - Math.exp(-dt / 900));
        const zoom = map.getZoom() - (pull - drop);
        drop = pull;
        map.setPaintProperty('tour-rail-ring', 'circle-radius', 24 + 6 * Math.sin(now / 250));
        // Turn towards the road ahead gently: sharp corners become sweeps
        bearing += turnTo(heading(d), bearing) * (1 - Math.exp(-dt / 700));
        map.jumpTo({ center: pointAt(d), bearing, zoom });
        reveal(d / length);
        showStops(d);
        // At the last stop: wait a moment, then go on (not while paused, and a jump back cancels it)
        if (d < length || paused) endAt = Infinity;
        else if (endAt === Infinity) endAt = now + TOUR.hold;
      }
      placeBus(d);
      if (now >= endAt) {
        if (leg >= svc.patterns.length) return stopTour();
        // Turn round: the panel and the link follow to the next direction
        view = { kind: 'service', svc: svcIdx, dir: (dir + 1) % svc.patterns.length };
        render();
        return startTour(leg + 1);
      }
      tour.frame = requestAnimationFrame(step);
    };
    tour = { frame: requestAnimationFrame(step), coords, bus, keys };
    writeHash(); // the link now ends in /fly: opening it starts the flight
  }

  function stopTour() {
    if (!tour) return;
    cancelAnimationFrame(tour.frame);
    const { coords } = tour;
    tour.bus.remove();
    tour = null;
    document.body.classList.remove('touring');
    hud.hidden = true;
    setNight(false);
    writeHash();
    drawSelection();
    map.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });
    fitCoords(coords, 16, { pitch: 0, bearing: 0, duration: 1200 });
  }
  // The bar's buttons; the keys (Esc, space, ← →) press the same buttons
  hud.addEventListener('click', (e) => {
    const act = /** @type {HTMLElement | null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-tour]'))?.dataset.tour;
    if (!act || !tour) return;
    sound.play(act === 'end' ? 'close' : 'tick');
    if (act === 'end') stopTour(); else tour.keys[/** @type {keyof TourKeys} */ (act)]();
  });

  // ---------- Events ----------

  // City picker
  cityMenu.innerHTML = regions.map((r) => `<li><button role="option" data-city="${r.id}" aria-selected="false">
      <b>${escapeHtml(r.name)}</b><span class="tick">✓</span>
      <small>${r.services} buses · ${escapeHtml(r.operators.join(', '))}</small></button></li>`).join('');
  function toggleCities(/** @type {boolean} */ open) {
    cityMenu.hidden = !open;
    regionBtn.setAttribute('aria-expanded', String(open));
    if (open) (/** @type {HTMLElement | null} */ (cityMenu.querySelector('[aria-selected="true"]')) ?? cityMenu.querySelector('button'))?.focus();
  }
  regionBtn.addEventListener('click', () => toggleCities(cityMenu.hidden));
  cityMenu.addEventListener('click', (e) => {
    const b = /** @type {HTMLElement | null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-city]'));
    if (!b) return;
    toggleCities(false);
    q.value = '';
    if (b.dataset.city !== regionId) { sound.play('city'); setRegion(/** @type {string} */ (b.dataset.city)); }
  });
  addEventListener('pointerdown', (e) => { if (!cityMenu.hidden && !(/** @type {HTMLElement} */ (e.target)).closest('.city')) toggleCities(false); });
  addEventListener('keydown', (e) => {
    if (cityMenu.hidden) return;
    if (e.key === 'Escape') { toggleCities(false); regionBtn.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const items = [...cityMenu.querySelectorAll('button')];
      const i = items.indexOf(/** @type {HTMLButtonElement} */ (document.activeElement));
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    }
  });

  q.addEventListener('input', () => {
    searchPlaces(q.value.trim().toLowerCase()); // first, so the list can say "Searching places…"
    if (view.kind !== 'home') go({ kind: 'home' }, { fly: false }); else render();
  });
  // Enter opens the top result · Esc clears, then leaves the box
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') (/** @type {HTMLElement | null} */ (body.querySelector('.row')))?.click();
    if (e.key === 'Escape') { if (q.value) { q.value = ''; render(); } else q.blur(); }
  });
  // "/" jumps to search · Esc closes the open bus/stop (like its ✕)
  addEventListener('keydown', (e) => {
    const typing = /** @type {HTMLElement} */ (e.target).closest('input, textarea');
    if (typing || !cityMenu.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if (tour) {
      const act = /** @type {Record<string, string>} */ ({ Escape: 'end', ' ': 'pause', ArrowLeft: 'prev', ArrowRight: 'next' })[e.key];
      if (act) { e.preventDefault(); (/** @type {HTMLElement | null} */ (hud.querySelector(`[data-tour="${act}"]`)))?.click(); }
      return;
    }
    if (e.key === '/') { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && view.kind !== 'home') (/** @type {HTMLElement | null} */ (body.querySelector('[data-back]')))?.click();
  });
  clearBtn.addEventListener('click', () => { q.value = ''; render(); q.focus(); });

  body.addEventListener('click', (e) => {
    const el = /** @type {HTMLElement | null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-svc],[data-stop],[data-dir],[data-back],[data-place],[data-passing],[data-fly]'));
    if (!el || !data) return;
    sound.play(el.dataset.back !== undefined ? 'close' : el.dataset.svc ? 'bus' : el.dataset.stop || el.dataset.place ? 'stop' : 'tick');
    if (el.dataset.back !== undefined) {
      return view.kind === 'service' && fromStop >= 0 ? go({ kind: 'stop', stop: fromStop })
        : view.kind === 'stop' && fromPlace ? go({ kind: 'place', place: fromPlace })
        : go({ kind: 'home' }, { fly: false });
    }
    if (el.dataset.fly !== undefined) return startTour();
    if (el.dataset.place) return openPlace(places.hits[+el.dataset.place]);
    if (el.dataset.passing !== undefined && view.kind === 'stop') {
      showAll = !showAll;
      render();
      drawSelection();
      if (showAll) fitCoords(data.stopServices[view.stop].flatMap((svc) => data.lines[svc].flat()), 15);
      return;
    }
    if (el.dataset.svc) {
      const svc = +el.dataset.svc, dir = +(el.dataset.dir ?? 0);
      // At a stop, like stop rows: 1st tap frames the bus's route, 2nd opens it
      if (view.kind === 'stop' && peekedSvc !== svc) {
        peekedSvc = svc;
        focusService(svc);
        return fitCoords(data.lines[svc][dir]);
      }
      return go({ kind: 'service', svc, dir });
    }
    if (el.dataset.stop) {
      const stop = +el.dataset.stop;
      // Any stop row in the sidebar: 1st tap zooms to the stop, 2nd opens it
      if (peeked !== stop && !(view.kind === 'stop' && view.stop === stop)) return peekStop(stop);
      return go({ kind: 'stop', stop });
    }
    if (el.dataset.dir && view.kind === 'service') return go({ ...view, dir: +el.dataset.dir });
  });

  // Hover a bus: preview its line (home), or single it out among the buses at a stop
  let hovered = -1;
  body.addEventListener('pointerover', (e) => {
    if (!data || e.pointerType === 'touch') return;
    const stopEl = /** @type {HTMLElement | null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-stop]'));
    hoverStop(stopEl ? +(/** @type {string} */ (stopEl.dataset.stop)) : -1);
    if (view.kind === 'service') return;
    const el = /** @type {HTMLElement | null} */ ((/** @type {HTMLElement} */ (e.target)).closest('[data-svc]'));
    const svcIdx = el ? +(/** @type {string} */ (el.dataset.svc)) : -1;
    focusService(svcIdx);
  });

  function focusService(/** @type {number} */ svcIdx) {
    if (!data || svcIdx === hovered) return;
    hovered = svcIdx;
    if (view.kind === 'home') {
      const color = svcIdx >= 0 ? colorOf(data.region.services[svcIdx]) : '';
      if (color) tint(color);
      source('sel').setData(fc(svcIdx >= 0 ? data.lines[svcIdx].map((coords) => line(coords, { color })) : []));
    } else if (view.kind === 'stop') {
      // Hover shows just that bus; with "show all" on, the rest stay faded behind it
      const lines = showAll ? stopLines(view.stop, svcIdx) : svcIdx >= 0 ? stopLines(view.stop, svcIdx).filter((f) => f.properties?.svc === svcIdx) : [];
      source('sel').setData(fc(lines));
      for (const row of body.querySelectorAll('[data-svc]')) row.classList.toggle('hl', +(/** @type {HTMLElement} */ (row).dataset.svc ?? -1) === svcIdx);
    }
  }
  body.addEventListener('pointerleave', () => { hovered = -1; hoverStop(-1); drawSelection(); if (peekedSvc >= 0) focusService(peekedSvc); });

  function hoverStop(/** @type {number} */ stop) {
    if (!data || stop === hoveredStop) return;
    hoveredStop = stop;
    const color = view.kind === 'service' ? colorOf(data.region.services[view.svc]) : stop >= 0 ? stopColor(stop) : STOP;
    source('hover-stop').setData(fc(stop >= 0 ? [point(stop, { color })] : []));
    hideStops();
  }

  const PEEK_BELOW = 15; // stop icons appear from here
  const pickable = ['pin-halo', 'sel-stops-dot', 'stops-icon', 'stops'];
  map.on('click', (e) => {
    if (!data) return;
    const box = /** @type {[[number, number], [number, number]]} */ ([[e.point.x - 8, e.point.y - 8], [e.point.x + 8, e.point.y + 8]]);
    // A live bus opens its route (already open: nothing to do)
    const bus = map.queryRenderedFeatures(box, { layers: ['buses'] })[0];
    if (bus) {
      if (bus.properties.svc >= 0 && view.kind !== 'service') { sound.play('bus'); go({ kind: 'service', svc: bus.properties.svc, dir: 0 }); }
      return;
    }
    const stop = map.queryRenderedFeatures(box, { layers: pickable.filter((l) => map.getLayer(l)) })[0];
    if (stop) {
      const i = stop.properties.i;
      sound.play('stop');
      // Zoomed out (dots): 1st click zooms to icon level, 2nd opens it
      if (map.getZoom() < PEEK_BELOW && peeked !== i && !(view.kind === 'stop' && view.stop === i)) {
        return map.easeTo({ center: stop.geometry.type === 'Point' ? /** @type {[number, number]} */ (stop.geometry.coordinates) : e.lngLat, zoom: PEEK_BELOW + 0.5, padding: pad(), duration: 500 });
      }
      return go({ kind: 'stop', stop: i });
    }
    // At a stop, clicking one of its bus lines opens that bus
    const route = view.kind === 'stop' ? map.queryRenderedFeatures(box, { layers: ['sel-line'] })[0] : undefined;
    if (route) { sound.play('bus'); return go({ kind: 'service', svc: route.properties.svc, dir: 0 }); }
    // Click another city's area → switch to it
    const area = map.queryRenderedFeatures(e.point, { layers: ['area-fill'] }).find((f) => f.properties.id !== data?.region.id);
    if (area) { sound.play('city'); hoverArea(''); setRegion(area.properties.id); }
  });

  map.on('mousemove', (e) => {
    if (!data) return;
    const box = /** @type {[[number, number], [number, number]]} */ ([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]]);
    const bus = map.queryRenderedFeatures(box, { layers: ['buses'] })[0];
    if (bus) {
      const { no, speed, time } = bus.properties;
      tip.innerHTML = `<span class="tag">${escapeHtml(String(no))}</span>${speed} km/h · ${Math.max(0, Math.round(Date.now() / 1000 - time))} s ago`;
      tip.style.left = `${e.originalEvent.clientX}px`;
      tip.style.top = `${e.originalEvent.clientY}px`;
      tip.classList.add('show');
      map.getCanvas().style.cursor = bus.properties.svc >= 0 ? 'pointer' : '';
      return;
    }
    const stop = map.queryRenderedFeatures(box, { layers: pickable })[0];
    const route = !stop && view.kind === 'stop' ? map.queryRenderedFeatures(box, { layers: ['sel-line'] })[0] : undefined;
    if (view.kind === 'stop') focusService(route ? route.properties.svc : -1);
    const area = stop || route ? undefined : map.queryRenderedFeatures(e.point, { layers: ['area-fill'] }).find((f) => f.properties.id !== data?.region.id);
    hoverArea(area ? String(area.properties.id) : '');
    map.getCanvas().style.cursor = stop || route || area ? 'pointer' : '';
    const showTip = Boolean(route) || Boolean(area) || (stop && map.getZoom() < 17 && !map.isMoving());
    if (showTip) {
      if (area) {
        tip.textContent = `Switch to ${area.properties.name}`;
      } else if (route) {
        tip.textContent = data.region.services[route.properties.svc].no;
      } else if (stop) {
        const { code, name } = stop.properties;
        tip.innerHTML = `${code ? `<span class="tag">${escapeHtml(code)}</span>` : ''}${escapeHtml(name)}`;
      }
      tip.style.left = `${e.originalEvent.clientX}px`;
      tip.style.top = `${e.originalEvent.clientY}px`;
    }
    tip.classList.toggle('show', Boolean(showTip));
  });
  let hoveredArea = '';
  function hoverArea(/** @type {string} */ id) {
    if (id === hoveredArea) return;
    if (hoveredArea) map.setFeatureState({ source: 'areas', id: hoveredArea }, { hover: false });
    if (id) map.setFeatureState({ source: 'areas', id }, { hover: true });
    hoveredArea = id;
  }
  map.on('movestart', () => tip.classList.remove('show'));
  map.getCanvas().addEventListener('mouseleave', () => { tip.classList.remove('show'); hoverArea(''); });

  const soundBtn = /** @type {HTMLElement} */ (document.querySelector('.sound-btn'));
  const showSound = (/** @type {boolean} */ on) => soundBtn.setAttribute('aria-pressed', String(on));
  showSound(sound.on);
  soundBtn.addEventListener('click', () => showSound(sound.toggle()));

  $('zoom-in').addEventListener('click', () => map.zoomIn());
  $('zoom-out').addEventListener('click', () => map.zoomOut());

  // Near me: jump to the city you're in
  $('locate').addEventListener('click', () => {
    navigator.geolocation?.getCurrentPosition(async ({ coords }) => {
      const here = /** @type {[number, number]} */ ([coords.longitude, coords.latitude]);
      const inside = regions.find(({ bounds: [w, s, e, n] }) => here[0] >= w && here[0] <= e && here[1] >= s && here[1] <= n);
      if (inside && inside.id !== regionId) await setRegion(inside.id, { kind: 'home' }, false);
      map.flyTo({ center: here, zoom: 16, padding: pad(), duration: 900 });
    }, () => { loading.textContent = 'Location unavailable'; loading.hidden = false; setTimeout(() => { loading.hidden = true; loading.textContent = 'Loading…'; }, 2000); });
  });

  // replaceState doesn't fire this, so it only runs for pasted/edited URLs
  addEventListener('hashchange', openFromHash);

  await openFromHash();
</script>
</body>
</html>
