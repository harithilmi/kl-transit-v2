<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2ee" />
  <title>KL Transit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231363b8'/%3E%3Crect x='8' y='7' width='16' height='16' rx='3' fill='%23fff'/%3E%3Crect x='10' y='10' width='12' height='6' rx='1' fill='%231363b8'/%3E%3Ccircle cx='11.5' cy='26' r='2' fill='%23fff'/%3E%3Ccircle cx='20.5' cy='26' r='2' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <script>
    // Ask for the data now, while the app's code is still downloading: the city list, then the city in the link (or the first)
    {
      const get = (name) => fetch(`data/${name}.json`, { cache: 'no-cache' }).then((r) => r.json());
      const regions = get('regions');
      const id = location.hash.split('/')[1];
      const first = regions.then((all) => {
        const region = all.find((r) => r.id === id) ?? all[0];
        return { id: region.id, region: get(region.id) };
      });
      first.catch(() => {});
      window.boot = { regions, first };
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
